spring:
  application:
    name: savemyseat
  datasource:
    url: jdbc:postgresql://localhost:5432/savemyseat
    username: savemyseat
    password: savemyseat
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    user:
      name: user
      password: devpassword
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: redis
      port: 6379

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 24

server:
  port: 8080