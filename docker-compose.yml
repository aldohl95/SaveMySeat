services:
  postgres:
    image: postgres:16-alpine
    container_name: savemyseat-postgres
    environment:
      POSTGRES_DB: savemyseat
      POSTGRES_USER: savemyseat
      POSTGRES_PASSWORD: savemyseat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savemyseat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: